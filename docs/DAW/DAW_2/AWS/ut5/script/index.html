
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servidor Web AWS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #9dc1e6;
            text-align: center;
            padding: 80px 20px;
        }
        .contenedor {
            background: rgb(236, 193, 193);
            max-width: 650px;
            margin: auto;
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        
        .contenedor_2 {
            background: lightgray;
            max-width: 650px;
            margin: auto;
            padding: 40px;
            border-radius: 12px;
        }
        h1 { color: #e47911; }
        h2 { color: #203acf; }
    </style>
</head>

<body>
    <div class="contenedor">
      <h1>¡Servidor web funcionando!</h1>
      <p>Instancia EC2 de AWS.</p>
      <p>Ubuntu Server + Apache2</p>
      <h2>Creado por Javier Egea Blasco</h2>
    </div>
    
    
    <div class="contenedor_2">
      <h1>Consulta de clientes</h1>
      <p>Esta página permite consultar los datos de un cliente mediante su ID.</p>
    

      <label for="idCliente">ID del cliente:</label>

    <input type="number" id="idCliente" value="1" min="1">

    <button onclick="consultarCliente()">
        Consultar
    </button>

    <div id="resultado"></div>
    </div>

    <script>
        async function consultarCliente() {

            const id = document.getElementById('idCliente').value;
            const resultado = document.getElementById('resultado');

            resultado.textContent = 'Consultando...';

            try {

                const respuesta = await fetch(`/api/clientes/${id}`);

                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(datos.error);
                }

                resultado.innerHTML = `
                    <h2>Datos del cliente</h2>
                    <p><strong>ID:</strong> ${datos.id}</p>
                    <p><strong>Nombre:</strong> ${datos.nombre}</p>
                    <p><strong>Email:</strong> ${datos.email}</p>
                `;

            } catch (error) {

                resultado.textContent = 'Error: ' + error.message;

            }
        }
    </script>

</body>
</html>
