AWSTemplateFormatVersion: "2010-09-09"
Description: VPC con subred pública y privada, Internet Gateway y NAT Gateway.

Resources:

# VPC
  VPCDespliegue:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 172.18.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: VPC-Despliegue

# Subred pública
  SubredPublica:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPCDespliegue
      CidrBlock: 172.18.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Subred-Publica

# Subred privada
  SubredPrivada:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPCDespliegue
      CidrBlock: 172.18.2.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: Subred-Privada

# Internet Gateway
  IGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: PuertaDeEnlace

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPCDespliegue
      InternetGatewayId: !Ref IGW

# Tabla de rutas pública
  RTSubredPublica:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPCDespliegue
      Tags:
        - Key: Name
          Value: RT-Subred-Publica

  RoutePublicInternet:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RTSubredPublica
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW

# IP elástica para la NAT
  ElasticIP:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: IP-Elastica

# NAT Gateway (en la subred pública)
  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: VPCGatewayAttachment
    Properties:
      AllocationId: !GetAtt ElasticIP.AllocationId
      SubnetId: !Ref SubredPublica
      Tags:
        - Key: Name
          Value: NAT-Gateway

# Tabla de rutas privada
  RTSubredPrivada:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPCDespliegue
      Tags:
        - Key: Name
          Value: RT-Subred-Privada

  RoutePrivateNat:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RTSubredPrivada
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

# Asociaciones
  AsociacionPublica:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubredPublica
      RouteTableId: !Ref RTSubredPublica

  AsociacionPrivada:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubredPrivada
      RouteTableId: !Ref RTSubredPrivada


# Grupo de seguridad sobre subnet pública para instancia de servidor web.
  SecurityGroupServidorWeb:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: "GS-ServidorWeb"
      GroupDescription: "Definiciones de los accesos"
      VpcId: !Ref VPCDespliegue
      SecurityGroupIngress:
        # Permitir tráfico web HTTP (Puerto 80)
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        # Permitir SSH (Puerto 22)
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        # Solo desarrollo eliminar en produccion
        - IpProtocol: "-1"
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        # Acceso a internet ilimitado
        - IpProtocol: "-1"
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: "GS-ServodrWeb"

# Grupo de seguridad sobre subnet privada para instancia de BBDD MySQL
  SecurityGroupMySQL:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: "GS-BBDD-MySQL"
      GroupDescription: "definiciones de los accesos"
      VpcId: !Ref VPCDespliegue
      SecurityGroupIngress:
        # Solo puerto 3306 DESDE el servidor web (referencia al Grupo de Seguridad anterior)
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref SecurityGroupServidorWeb
        # Permitir SSH (Puerto 22)
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: "-1"
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: "Tarea-1-GS-BBDD-MySQL"

# EC2 Servidor Web (en Subred Pública)
  ServidorWebInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "ami-0d97d7f07b25dd693"
      InstanceType: "t3.medium"
      SubnetId: !Ref SubredPublica
      SecurityGroupIds:
        - !Ref SecurityGroupServidorWeb
      AssociatePublicIpAddress: true
      KeyName: "vockey"
      UserData: 
        Fn::Base64: !Sub |
          #!/bin/bash

          # Registrar toda la salida del script
          exec > >(tee -a /var/log/user-data.log) 2>&1

          set -euxo pipefail

          echo "======================================"
          echo " INICIANDO INSTALACION DEL SERVIDOR WEB"
          echo "======================================"

          # Actualizar repositorios
          apt-get update
          
          # Instalar actualizaciones
          sudo apt-get upgrade -y
          
          # Instalar Apache
          DEBIAN_FRONTEND=noninteractive apt-get install -y apache2
          
          # Instalar node 
          sudo apt-get install nodejs npm -y
          
          # Directorio para la API
          mkdir /home/ubuntu/api-web
          cd /home/ubuntu/api-web
          npm init -y
          npm install express mysql2

          # -------------------------------------
          # Crear archivo de configuracion inicio
          # -------------------------------------
          cat > /home/ubuntu/api-web/server.js << 'EOF'
          const express = require('express');
          const mysql = require('mysql2/promise');

          const app = express();
          const PORT = 3000;

          // Configuracion de la conexion a MariaDB
          const db = mysql.createPool({
              host: process.env.DB_HOST,
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: 'appdb',
              waitForConnections: true,
              connectionLimit: 10
          });

          // Endpoint para consultar un cliente por su ID
          app.get('/api/clientes/:id', async (req, res) => {

              try {
                  const id = Number(req.params.id);

                  if (!Number.isInteger(id) || id < 1) {
                      return res.status(400).json({
                          error: 'Identificador no valido'
                      });
                  }

                  const [filas] = await db.execute(
                      'SELECT id, nombre, email FROM clientes WHERE id = ?',
                      [id]
                  );

                  if (filas.length === 0) {
                      return res.status(404).json({
                          error: 'Cliente no encontrado'
                      });
                  }

                  res.json(filas[0]);

              } catch (error) {
                  console.error('Error consultando MariaDB:', error);

                  res.status(500).json({
                      error: 'Error interno del servidor'
                  });
              }
          });

          // Iniciar API exclusivamente en localhost
          app.listen(PORT, '127.0.0.1', () => {
              console.log(`API funcionando en el puerto ${PORT}`);
          });
          EOF
          # -------------------------------------
          # Crear archivo de configuracion fin
          # -------------------------------------

          # ----------------------------------
          # Configurar las credenciales inicio
          # ----------------------------------
          cat > /etc/api-web.env << 'EOF'
          DB_HOST=10.0.1.50
          DB_USER=appuser
          DB_PASSWORD=TU_CONTRASEÑA
          EOF
          # ----------------------------------
          # Configurar las credenciales fin
          # ----------------------------------

          # Proteger archivo
          sudo chmod 600 /etc/api-web.env

          # -------------------------------------
          # Crear un servicio para Node.js INICIO
          # -------------------------------------
          cat > /etc/systemd/system/api-web.service << 'EOF'
          [Unit]
          Description=API Node.js para MariaDB
          After=network.target

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/home/ubuntu/api-web
          EnvironmentFile=/etc/api-web.env
          ExecStart=/usr/bin/node /home/ubuntu/api-web/server.js
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOF
          # -------------------------------------
          # Crear un servicio para Node.js FIN
          # -------------------------------------

          # Activar API
          sudo systemctl daemon-reload
          sudo systemctl enable --now api-web

          # Configurar Apache como intermediario
          sudo a2enmod proxy proxy_http

          # Crear la configuracion para redirigir las peticiones API hacia Node.js
          cat > /etc/apache2/conf-available/api-web.conf << 'EOF'
          ProxyPreserveHost On

          ProxyPass /api http://127.0.0.1:3000/api
          ProxyPassReverse /api http://127.0.0.1:3000/api
          EOF


          # Activar Apache
          sudo a2enconf api-web
          sudo apache2ctl configtest
          systemctl enable apache2
          systemctl start apache2
          sudo systemctl restart apache2

          # Crear página web 
          cat > /var/www/html/index.html <<'EOF'
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Servidor Web AWS</title>
              <style>
                  body {
                      font-family: Arial, sans-serif;
                      background: #9dc1e6;
                      text-align: center;
                      padding: 80px 20px;
                  }
                  .contenedor {
                      background: rgb(236, 193, 193);
                      max-width: 650px;
                      margin: auto;
                      padding: 40px;
                      border-radius: 12px;
                      margin-bottom: 25px;
                  }

                  .contenedor_2 {
                      background: lightgray;
                      max-width: 650px;
                      margin: auto;
                      padding: 40px;
                      border-radius: 12px;
                  }
                  .consultarCliente {
                      background: rgb(221, 235, 220);
                      max-width: 500px;
                      margin: auto;
                      padding: 20px;
                      border-radius: 6px;
                  }

                  .aspectoBoton {
                      background: rgb(69, 173, 221);
                      margin: auto;
                      margin-top: 20px;
                      display: block;
                      border-radius: 6px;
                      padding: 8px 16px;
                      border: none;
                      cursor: pointer;
                  }

                  h1 { color: #e47911; }
                  h2 { color: #203acf; }
              </style>
          </head>

          <body>

              <div class="contenedor">
                <h1>¡Servidor web funcionando!</h1>
                <p>Instancia EC2 de AWS.</p>
                <p>Ubuntu Server + Apache2</p>
                <h2>Creado por Javier Egea Blasco</h2>
              </div>

              <div class="contenedor_2">
                <h1>Consulta de clientes</h1>
                <p>Esta página permite consultar los datos de un cliente mediante su ID.</p>

                <div class="consultarCliente">
                  <label for="idCliente">ID del cliente:</label>
                  <input type="number" id="idCliente" value="1" min="1">
                  <button onclick="consultarCliente()" class="aspectoBoton">
                      Consultar
                  </button>
                  <div id="resultado"></div>
                </div>
              </div>  

              <script>
                  async function consultarCliente() {
                      const id = document.getElementById('idCliente').value;
                      const resultado = document.getElementById('resultado');

                      resultado.textContent = 'Consultando...';

                      try {
                          const respuesta = await fetch(`/api/clientes/${id}`);
                          const datos = await respuesta.json();

                          if (!respuesta.ok) {
                              throw new Error(datos.error);
                          }

                          resultado.innerHTML = `
                              <h2>Datos del cliente</h2>
                              <p><strong>ID:</strong> ${datos.id}</p>
                              <p><strong>Nombre:</strong> ${datos.nombre}</p>
                              <p><strong>Email:</strong> ${datos.email}</p>
                          `;

                      } catch (error) {
                          resultado.textContent = 'Error: ' + error.message;
                      }
                  }
              </script>

          </body>
          </html>
          EOF

          # Permisos
          chown -R www-data:www-data /var/www/html
          chmod -R 755 /var/www/html

          # Reiniciar Apache
          systemctl restart apache2

          # Comprobación
          systemctl is-active apache2

          cho "======================================"
          cho " INSTALACION FINALIZADA CORRECTAMENTE"
          cho "======================================"
      Tags:
        - Key: Name
          Value: "ServidorWeb"

# EC2 BBDD MySQL (en Subred Privada)
  ServidorDbInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "ami-0d97d7f07b25dd693"
      InstanceType: "t3.micro"
      SubnetId: !Ref SubredPrivada
      SecurityGroupIds:
        - !Ref SecurityGroupMySQL
      AssociatePublicIpAddress: false
      KeyName: "vockey"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash

          set -euxo pipefail

          echo "======================================"
          echo " INSTALANDO MARIADB"
          echo "======================================"

          # CONFIGURACION DE LA BASE DE DATOS
          DB_NAME="appdb"
          DB_USER="appuser"
          DB_PASSWORD="CambiaEstaClave2026Segura"

          # Actualizar repositorios
          apt-get update

          # Instalar actualizaciones
          sudo apt-get upgrade -y

          # Instalar MariaDB
          DEBIAN_FRONTEND=noninteractive apt-get install -y mariadb-server

          # Configurar acceso remoto
          sed -i 's/^bind-address[[:space:]]*=.*/bind-address = 0.0.0.0/' \
              /etc/mysql/mariadb.conf.d/50-server.cnf

          # Habilitar e iniciar el servicio
          systemctl enable --now mariadb

          # Reiniciar para aplicar la configuracion
          systemctl restart mariadb

          echo "======================================"
          echo " CREANDO BASE DE DATOS Y USUARIO"
          echo "======================================"

          mariadb <<EOF
          CREATE DATABASE IF NOT EXISTS ${DB_NAME}
          CHARACTER SET utf8mb4
          COLLATE utf8mb4_unicode_ci;

          CREATE USER IF NOT EXISTS '$${DB_USER}'@'%'
          IDENTIFIED BY '$${DB_PASSWORD}';

          ALTER USER '$${DB_USER}'@'%'
          IDENTIFIED BY '$${DB_PASSWORD}';

          GRANT ALL PRIVILEGES ON ${DB_NAME}.*
          TO '$${DB_USER}'@'%';

          FLUSH PRIVILEGES;
          EOF

          echo "======================================"
          echo " COMPROBANDO INSTALACION"
          echo "======================================"
          
          systemctl is-active mariadb
          
          mariadb -e "SHOW DATABASES;"
          
          echo "======================================"
          echo " INSTALACION FINALIZADA"
          echo "======================================"
                Tags:
                  - Key: Name
                    Value: "ServidorBBDD"    

Outputs:
  VpcId:
    Description: ID de la VPC
    Value: !Ref VPCDespliegue
  SubredPublicaId:  
    Description: ID de la subred pública
    Value: !Ref SubredPublica
  SubredPrivadaId:
    Description: ID de la subred privada
    Value: !Ref SubredPrivada