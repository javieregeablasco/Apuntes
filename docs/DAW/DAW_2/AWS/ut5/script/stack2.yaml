AWSTemplateFormatVersion: "2010-09-09"
Description: VPC con subred pública y privada, Internet Gateway y NAT Gateway.

Resources:

# VPC
  VPCDespliegue:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 172.18.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: VPC-Despliegue

# Subred pública
  SubredPublica:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPCDespliegue
      CidrBlock: 172.18.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Subred-Publica

# Subred privada
  SubredPrivada:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPCDespliegue
      CidrBlock: 172.18.2.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: Subred-Privada

# Internet Gateway
  IGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: PuertaDeEnlace

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPCDespliegue
      InternetGatewayId: !Ref IGW

# Tabla de rutas pública
  RTSubredPublica:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPCDespliegue
      Tags:
        - Key: Name
          Value: RT-Subred-Publica

  RoutePublicInternet:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RTSubredPublica
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW

# IP elástica para la NAT
  ElasticIP:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: IP-Elastica

# NAT Gateway (en la subred pública)
  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: VPCGatewayAttachment
    Properties:
      AllocationId: !GetAtt ElasticIP.AllocationId
      SubnetId: !Ref SubredPublica
      Tags:
        - Key: Name
          Value: NAT-Gateway

# Tabla de rutas privada
  RTSubredPrivada:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPCDespliegue
      Tags:
        - Key: Name
          Value: RT-Subred-Privada

  RoutePrivateNat:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RTSubredPrivada
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

# Asociaciones
  AsociacionPublica:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubredPublica
      RouteTableId: !Ref RTSubredPublica

  AsociacionPrivada:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubredPrivada
      RouteTableId: !Ref RTSubredPrivada

# Grupo de seguridad sobre subnet pública para instancia de servidor web.
  SecurityGroupServidorWeb:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: "GS-ServidorWeb"
      GroupDescription: "Definiciones de los accesos"
      VpcId: !Ref VPCDespliegue
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: "-1"
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: "-1"
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: "GS-ServodrWeb"

# Grupo de seguridad sobre subnet privada para instancia de BBDD MySQL
  SecurityGroupMySQL:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: "GS-BBDD-MySQL"
      GroupDescription: "definiciones de los accesos"
      VpcId: !Ref VPCDespliegue
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref SecurityGroupServidorWeb
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: "-1"
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: "Tarea-1-GS-BBDD-MySQL"

# EC2 Servidor Web (en Subred Pública)
  ServidorWebInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "ami-0d97d7f07b25dd693"
      InstanceType: "t3.medium"
      SubnetId: !Ref SubredPublica
      SecurityGroupIds:
        - !Ref SecurityGroupServidorWeb
      AssociatePublicIpAddress: true
      KeyName: "vockey"
      UserData: 
        Fn::Base64: !Sub |
          #!/bin/bash
          exec > >(tee -a /var/log/user-data.log) 2>&1
          set -euxo pipefail

          apt-get update
          sudo apt-get upgrade -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y apache2
          sudo apt-get install nodejs npm -y
          
          mkdir /home/ubuntu/api-web
          cd /home/ubuntu/api-web
          npm init -y
          npm install express mysql2

          cat > /home/ubuntu/api-web/server.js << 'EOF'
          const express = require('express');
          const mysql = require('mysql2/promise');
          const app = express();
          const PORT = 3000;

          const db = mysql.createPool({
              host: process.env.DB_HOST,
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: 'appdb',
              waitForConnections: true,
              connectionLimit: 10
          });

          app.get('/api/clientes/:id', async (req, res) => {
              try {
                  const id = Number(req.params.id);
                  if (!Number.isInteger(id) || id < 1) {
                      return res.status(400).json({ error: 'Identificador no valido' });
                  }
                  const [filas] = await db.execute('SELECT id, nombre, email FROM clientes WHERE id = ?', [id]);
                  if (filas.length === 0) {
                      return res.status(404).json({ error: 'Cliente no encontrado' });
                  }
                  res.json(filas[0]);
              } catch (error) {
                  console.error('Error consultando MariaDB:', error);
                  res.status(500).json({ error: 'Error interno del servidor' });
              }
          });

          app.listen(PORT, '127.0.0.1', () => {
              console.log(`API funcionando en el puerto ${PORT}`);
          });
          EOF

          cat > /etc/api-web.env << 'EOF'
          DB_HOST=10.0.2.15
          DB_USER=appuser
          DB_PASSWORD=CambiaEstaClave2026Segura
          EOF

          sudo chmod 600 /etc/api-web.env

          cat > /etc/systemd/system/api-web.service << 'EOF'
          [Unit]
          Description=API Node.js para MariaDB
          After=network.target

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/home/ubuntu/api-web
          EnvironmentFile=/etc/api-web.env
          ExecStart=/usr/bin/node /home/ubuntu/api-web/server.js
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload
          sudo systemctl enable --now api-web
          sudo a2enmod proxy proxy_http

          cat > /etc/apache2/conf-available/api-web.conf << 'EOF'
          ProxyPreserveHost On
          ProxyPass /api http://127.0.0.1:3000/api
          ProxyPassReverse /api http://127.0.0.1:3000/api
          EOF

          sudo a2enconf api-web
          systemctl enable apache2
          systemctl start apache2
          sudo systemctl restart apache2
          chown -R www-data:www-data /var/www/html
          chmod -R 755 /var/www/html
      Tags:
        - Key: Name
          Value: "ServidorWeb"

# EC2 BBDD MySQL (en Subred Privada)
  ServidorDbInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "ami-0d97d7f07b25dd693"
      InstanceType: "t3.micro"
      SubnetId: !Ref SubredPrivada
      SecurityGroupIds:
        - !Ref SecurityGroupMySQL
      AssociatePublicIpAddress: false
      KeyName: "vockey"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          # CONFIGURACION DE LA BASE DE DATOS (Escapando el símbolo $ para Bash)
          DB_NAME="appdb"
          DB_USER="appuser"
          DB_PASSWORD="CambiaEstaClave2026Segura"

          apt-get update
          sudo apt-get upgrade -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y mariadb-server

          sed -i 's/^bind-address[[:space:]]*=.*/bind-address = 0.0.0.0/' \
              /etc/mysql/mariadb.conf.d/50-server.cnf

          systemctl enable --now mariadb
          systemctl restart mariadb

          # Usamos $${VARIABLE} para que !Sub no intente interpretarlo como recurso CloudFormation
          mariadb <<EOF
          CREATE DATABASE IF NOT EXISTS $${DB_NAME}
          CHARACTER SET utf8mb4
          COLLATE utf8mb4_unicode_ci;

          CREATE USER IF NOT EXISTS '$${DB_USER}'@'%'
          IDENTIFIED BY '$${DB_PASSWORD}';

          ALTER USER '$${DB_USER}'@'%'
          IDENTIFIED BY '$${DB_PASSWORD}';

          GRANT ALL PRIVILEGES ON $${DB_NAME}.*
          TO '$${DB_USER}'@'%';

          FLUSH PRIVILEGES;
          EOF

          systemctl is-active mariadb
          mariadb -e "SHOW DATABASES;"
      Tags:
        - Key: Name
          Value: "ServidorBBDD"    

Outputs:
  VpcId:
    Description: ID de la VPC
    Value: !Ref VPCDespliegue
  SubredPublicaId:  
    Description: ID de la subred pública
    Value: !Ref SubredPublica
  SubredPrivadaId:
    Description: ID de la subred privada
    Value: !Ref SubredPrivada