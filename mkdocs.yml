site_name: Javier Egea Blasco

site_url: https://javieregeablasco.github.io/Apuntes

theme:
  language: es
  name: material
  
  features:
    - navigation.instant
    - navigation.instant.prefetch
    
    
    
    - navigation.instant.progress
      - navigation.expand
      - navigation.path
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - toc.follow
    - navigation.footer #añade flechas de navegacion en el footer
    # - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link

  logo: assets/mre.png
  favicon: assets/favicon.png

  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      # scheme: youtube 
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      # primary: indigo          # Color principal (barra superior)   
      # accent: indigo           # Color de acentos y enlaces
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference   

    # - primary: custom

plugins:
  - search
  - tags
  - blog
   

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true 
  # - codehilite       
  - admonition
  # - toc:
      # permalink: false
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables   
  - pymdownx.caret
  

