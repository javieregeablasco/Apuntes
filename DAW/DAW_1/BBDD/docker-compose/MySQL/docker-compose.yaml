services:
  mysql:
    image: mysql:latest
    container_name: mysql_container_local
    restart: always

    ports: 
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: 123456789
      MYSQL_DATABASE: MiBBDD
      MYSQL_USER: javier
      MYSQL_PASSWORD: 123456789

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: